# Runs the offline test suite (no model key needed) on every push and pull request.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      # CPU-only torch first, as in the Dockerfile, so the embedder test runs without the CUDA wheels.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install ".[dev]"
      - run: pytest
